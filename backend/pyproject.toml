[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "devagent-backend"
version = "0.1.0"
description = "DevAgent - AI software engineering agent (API + worker)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "arq>=0.26.3",
    "httpx>=0.27.2",
    "PyJWT>=2.10.0",
    "argon2-cffi>=23.1.0",
    "docker>=7.1.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-docker>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF", "S", "T20", "PT"]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # FastAPI Depends() in defaults
    "S101",   # assert is fine in tests (per-file ignore below is narrower)
    "RUF001", # ambiguous unicode in docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "T20", "ASYNC240", "ASYNC221"]
"app/tools/docker/policy.py" = ["S603", "S607"]  # the allow-list policy inspects raw argv
# S108: "/tmp" and "/home/runner/.cache" here are *container* paths inside the
# sandbox, not host temporary directories.
"app/tools/docker/*.py" = ["S108"]
"app/workers/jobs/apply_and_test.py" = ["S603", "S607", "ASYNC221"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "."
files = ["app"]
strict = true
warn_unreachable = true
disallow_any_generics = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["docker.*", "arq.*", "pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "unit: pure unit tests, no database, no docker, no network",
    "db: requires TEST_DATABASE_URL (PostgreSQL + pgvector)",
    "docker: requires a running docker daemon and the sandbox runner image",
    "e2e: full golden-path test (database + docker + agents)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
