name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests && ruff format --check app tests
      - name: Types
        run: mypy app
      - name: Unit tests
        run: pytest -m "not docker and not db" -q

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devagent
          POSTGRES_PASSWORD: devagent_ci
          POSTGRES_DB: devagent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devagent" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://devagent:devagent_ci@localhost:5432/devagent_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key
      JWT_SECRET: ci-only-jwt-secret
      ALLOW_LOCAL_REPO_IMPORT: "true"
      LOCAL_IMPORT_ROOTS: ./tests/fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Database tests
        run: pytest -m db -q

  sandbox:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
      SECRET_KEY: ci-only-secret-key
      JWT_SECRET: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Build sandbox runner image
        run: docker build -f ../infra/sandbox/runner-python.Dockerfile -t devagent/runner-python:3.12 ../infra/sandbox
      - name: Sandbox isolation tests
        run: pytest -m docker -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test -- --run
