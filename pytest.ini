[pytest]
testpaths = backend/tests
asyncio_mode = auto
addopts = -q --strict-markers
norecursedirs = .git .venv node_modules data backend/data fixtures workspaces dist
markers =
    unit: pure unit tests, no database, no docker, no network
    db: requires TEST_DATABASE_URL (PostgreSQL + pgvector)
    docker: requires a running docker daemon and the sandbox runner image
    e2e: full golden-path test (database + docker + agents)
